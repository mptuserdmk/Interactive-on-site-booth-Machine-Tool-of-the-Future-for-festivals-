<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iPhone / Mobile Camera — Станок Будущего</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body {
      background: #000;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      justify-content: space-between;
    }
    .mobile-header {
      padding: 15px;
      text-align: center;
      background: rgba(14, 21, 38, 0.9);
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }
    .mobile-viewfinder {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050810;
    }
    #mobile-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .shutter-bar {
      padding: 25px 20px;
      background: rgba(14, 21, 38, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      z-index: 10;
      border-top: 1px solid var(--border-color);
    }
    .shutter-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      background: var(--accent-cyan);
      box-shadow: 0 0 25px var(--accent-cyan);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .shutter-btn:active {
      transform: scale(0.92);
      background: #ffffff;
    }
    .status-toast {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      border: 1px solid var(--accent-cyan);
      z-index: 20;
    }
  </style>
</head>
<body>
  <div class="mobile-header">
    <div style="font-weight: 800; color: var(--accent-cyan); font-size: 16px;">📱 МОБИЛЬНАЯ КАМЕРА (AIR/OTA)</div>
    <div style="font-size: 12px; color: var(--text-muted);">Съемка участника прямо с iPhone по Wi-Fi</div>
  </div>

  <div class="mobile-viewfinder">
    <div id="toast" class="status-toast">Подключение к камере...</div>
    <video id="mobile-video" autoplay playsinline muted></video>
    <canvas id="mobile-canvas" style="display: none;"></canvas>
    <div class="viewfinder-reticle"></div>
  </div>

  <div class="shutter-bar">
    <button class="shutter-btn" id="btn-shutter">📸</button>
    <label class="btn-secondary" style="font-size: 14px; padding: 12px 18px; cursor: pointer;">
      📁 Из галереи
      <input type="file" id="file-input" accept="image/*" style="display: none;">
    </label>
  </div>

  <script>
    const video = document.getElementById('mobile-video');
    const canvas = document.getElementById('mobile-canvas');
    const toast = document.getElementById('toast');
    const btnShutter = document.getElementById('btn-shutter');
    const fileInput = document.getElementById('file-input');

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        video.srcObject = stream;
        toast.innerText = 'Камера готова! Нажмите 📸 для съемки';
      } catch (err) {
        console.error(err);
        toast.innerText = 'Камера заблокирована браузером. Используйте кнопку "Из галереи"';
      }
    }

    async function uploadBlob(blob) {
      toast.innerText = '⏳ Отправляем снимок на стенд...';
      const formData = new FormData();
      formData.append('file', blob, 'iphone_capture.jpg');

      try {
        const res = await fetch('/api/camera/upload-ota', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (data.status === 'ok') {
          toast.innerText = '✅ Фото мгновенно передано на экран стенда!';
          if (navigator.vibrate) navigator.vibrate(100);
        } else {
          toast.innerText = 'Ошибка отправки: ' + data.message;
        }
      } catch (e) {
        toast.innerText = 'Ошибка связи со стендом';
      }
    }

    btnShutter.addEventListener('click', () => {
      if (!video.videoWidth) {
        fileInput.click();
        return;
      }
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      canvas.toBlob((blob) => {
        if (blob) uploadBlob(blob);
      }, 'image/jpeg', 0.95);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        uploadBlob(e.target.files[0]);
      }
    });

    initCamera();
  </script>
</body>
</html>
