<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Станок Будущего // Киоск</title>
  
  <!-- Google Fonts: Fredoka & Nunito for Display, Inter for Text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: {
              DEFAULT: '#FAF7F2',
              card: '#FFFFFF',
              muted: '#F0EAE1',
              dark: '#1E1B4B'
            },
            ink: {
              DEFAULT: '#1E1B4B',
              muted: '#64748B',
              light: '#94A3B8'
            },
            border: {
              line: '#E2D9CE',
              dark: '#C8BEB1'
            },
            coral: {
              DEFAULT: '#FF5A5F',
              light: '#FF7579',
              dark: '#E03E43'
            },
            teal: {
              DEFAULT: '#00C49F',
              light: '#2DE2BE',
              dark: '#009E80'
            },
            amber: {
              DEFAULT: '#FFB300',
              light: '#FFCA47',
              dark: '#D48E00'
            },
            indigo: {
              DEFAULT: '#6366F1',
              light: '#818CF8',
              dark: '#4338CA'
            }
          },
          fontFamily: {
            display: ['Fredoka', 'Nunito', 'sans-serif'],
            sans: ['Inter', 'system-ui', 'sans-serif']
          },
          borderWidth: {
            '3': '3px',
            '6': '6px',
            '8': '8px'
          },
          boxShadow: {
            'tactile': '0 8px 0 rgba(30, 27, 75, 0.12), 0 16px 24px rgba(30, 27, 75, 0.08)',
            'tactile-sm': '0 4px 0 rgba(30, 27, 75, 0.08)'
          },
          animation: {
            'fade-in': 'fadeIn 0.25s ease-out forwards',
            'scale-up': 'scaleUp 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
            'fade-out': 'fadeOut 0.2s ease-out forwards'
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(6px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            },
            scaleUp: {
              '0%': { opacity: '0', transform: 'scale(0.92)' },
              '100%': { opacity: '1', transform: 'scale(1)' }
            },
            fadeOut: {
              '0%': { opacity: '1' },
              '100%': { opacity: '0' }
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 and Babel Standalone for seamless execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --surface: #FAF7F2;
      --surface-card: #FFFFFF;
      --surface-muted: #F0EAE1;
      --ink: #1E1B4B;
      --ink-muted: #64748B;
      --accent-coral: #FF5A5F;
      --accent-teal: #00C49F;
      --accent-amber: #FFB300;
      --border-line: #E2D9CE;
    }

    body {
      background-color: var(--surface);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Ambient background pattern */
    .kiosk-grid-bg {
      background-image: radial-gradient(#E2D9CE 1.5px, transparent 1.5px);
      background-size: 32px 32px;
    }
  </style>
</head>
<body class="kiosk-grid-bg min-h-screen">
  <!-- React App Root Container -->
  <div id="react-kiosk-root"></div>

  <!-- Load and Execute React Application -->
  <script type="text/babel" src="/static/js/kiosk_app.jsx"></script>
</body>
</html>
