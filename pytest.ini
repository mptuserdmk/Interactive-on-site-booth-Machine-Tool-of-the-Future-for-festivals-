[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
timeout = 60
addopts = -ra --strict-markers -p no:cacheprovider
markers =
    unit: изолированные тесты одного модуля
    integration: несколько модулей вместе через API (ASGI, без сети)
    e2e: сквозные сценарии через браузер (Playwright) или живой сервер
    security: пентест-проверки (только localhost)
    load: нагрузочные проверки
    soak: длительные проверки утечек (запускать отдельно)
    chaos: отказы зависимостей и восстановление
    visual: рендер карточек и визуальная регрессия
    slow: тесты дольше ~10 секунд
    regression: регресс-тесты подтверждённых дефектов (падают до фикса)
